version: "3.9"

# TerreX — fully local stack: frontend, backend (AI inference runs in-process
# here, per the "no unnecessary microservices" instruction), Qdrant, and
# Postgres/PostGIS. No service in this file talks to the internet at runtime.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: terrex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: terrex
      POSTGRES_PASSWORD: terrex
      POSTGRES_DB: terrex
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [terrex-net]

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: terrex-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks: [terrex-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terrex-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      OFFLINE_MODE: "true"
      MODEL_DIR: /models
      DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg2://terrex:terrex@postgres:5432/terrex
      PROCESSING_VERSION: terrex-mvp-0.1.0
    volumes:
      - ./models:/models:ro
      - ./data:/data
    ports:
      - "8000:8000"
    networks: [terrex-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: terrex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    networks: [terrex-net]

volumes:
  pgdata:
  qdrant_data:

networks:
  terrex-net:
    driver: bridge
